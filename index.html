<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="Unusually Inexpensive" />
    <title>Unusually Inexpensive</title>
  </head>
  <body>
    <main class="terminal" aria-label="Unusually Inexpensive">
      <div class="grain" aria-hidden="true"></div>
      <div class="scanlines" aria-hidden="true"></div>
      <div class="corner corner-tl" aria-hidden="true"></div>
      <div class="corner corner-br" aria-hidden="true"></div>

      <aside class="side-label">
        <span>UNUSUALLY INEXPENSIVE</span><i></i><span>TRANSMISSION 001</span>
      </aside>

      <header class="topline">
        <p>REC / UI-0001</p>
        <p class="status"><b id="signal-dot"></b>SIGNAL <span id="signal">STABLE</span></p>
        <p>08.12.26 // 14:32:07</p>
      </header>

      <section class="mark-zone" aria-label="Unusually Inexpensive">
        <div class="mark-wrap">
          <img class="mark ghost ghost-one" src="/unusinexp.png" alt="" aria-hidden="true" />
          <img class="mark ghost ghost-two" src="/unusinexp.png" alt="" aria-hidden="true" />
          <img class="mark ghost ghost-three" src="/unusinexp.png" alt="" aria-hidden="true" />
          <img class="mark main-mark" src="/unusinexp.png" alt="Unusually Inexpensive" />
        </div>
      </section>

      <footer class="receipt">
        <p>ISSUED: MILLION / SLOWCIAL / CONSOIGNEUR</p>
        <p>UNITS: 03 +</p>
        <p>STATUS: UNDECLARED</p>
        <p class="receipt-end">KEEP THIS RECEIPT</p>
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
